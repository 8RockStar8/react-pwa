    <script>
      // Paint the right background before React loads, so dark-mode users don't see a white flash.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('theme-mode'));
          var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.style.background = dark ? '#0e141c' : '#f2f5f7';
        } catch (e) {}
      })();
    </script>
